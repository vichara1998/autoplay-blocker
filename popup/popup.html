<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Autoplay Blocker</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header class="app__header">
      <img src="../icons/icon48.png" alt="" class="app__logo" width="36" height="36" />
      <div>
        <h1 class="app__title">Autoplay Blocker</h1>
        <p class="app__subtitle" id="statusText">Checking this page&hellip;</p>
      </div>
    </header>

    <section class="card" aria-label="Blocking controls">
      <div class="row">
        <div>
          <p class="row__label">Block autoplay everywhere</p>
          <p class="row__hint">Master switch for the whole extension</p>
        </div>
        <label class="switch">
          <input type="checkbox" id="globalToggle" />
          <span class="switch__track"><span class="switch__thumb"></span></span>
        </label>
      </div>

      <div class="row">
        <div>
          <p class="row__label">Block on <span id="siteName">this site</span></p>
          <p class="row__hint">Override just for the current website</p>
        </div>
        <label class="switch">
          <input type="checkbox" id="siteToggle" />
          <span class="switch__track"><span class="switch__thumb"></span></span>
        </label>
      </div>
    </section>

    <button class="button" id="pauseBtn" type="button">Pause all videos on this page</button>

    <footer class="app__footer">
      <a href="#" id="optionsLink">Manage sites &amp; advanced settings</a>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
